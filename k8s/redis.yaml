apiVersion: apps/v1
kind: Deployment
metadata:
  name: budget-sync-redis
  labels:
    app: budget-sync-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: budget-sync-redis
  template:
    metadata:
      labels:
        app: budget-sync-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - name: redis
              containerPort: 6379
          # The BullMQ queue is transient (jobs are re-enqueued by the
          # scheduler); no durability needed, so use emptyDir instead of a PVC.
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: budget-sync-redis
  labels:
    app: budget-sync-redis
spec:
  type: ClusterIP
  selector:
    app: budget-sync-redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
