# Kustomize entrypoint for the budget-sync monolith deployment.
#
# The Secret `budget-sync-secrets` is NOT listed here. It is delivered as a
# SealedSecret generated out-of-band by
# `homelab/scripts/seal-budget-sync-secrets.sh` and committed separately into
# the homelab repo (so plaintext secrets never live in this repo). The
# sealed-secrets controller decrypts it in-cluster into the Secret that
# `deployment.yaml` consumes via envFrom.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: budget-sync

resources:
  - namespace.yaml
  - configmap.yaml
  - redis.yaml
  - deployment.yaml
  - service.yaml
  - webhook-nodeport.yaml
  - web-deployment.yaml
  - web-service.yaml
  - ingress.yaml
  - servicemonitor.yaml
  # - sealedsecret.yaml  # generated by homelab/scripts/seal-budget-sync-secrets.sh (produces Secret budget-sync-secrets)
