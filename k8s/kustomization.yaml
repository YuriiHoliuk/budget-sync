# Kustomize entrypoint for the budget-sync monolith deployment.
#
# The Secret `budget-sync-secrets` is delivered as the SealedSecret in
# `sealedsecret.yaml`, generated by `homelab/scripts/seal-budget-sync-secrets.sh`
# (values sourced from GCP Secret Manager). The file is encrypted — only the
# in-cluster sealed-secrets controller can decrypt it — so it is safe to commit
# here. The controller decrypts it into the Secret that `deployment.yaml`
# consumes via envFrom.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: budget-sync

resources:
  - namespace.yaml
  - configmap.yaml
  - redis.yaml
  - deployment.yaml
  - service.yaml
  - webhook-nodeport.yaml
  - web-deployment.yaml
  - web-service.yaml
  - ingress.yaml
  - servicemonitor.yaml
  - grafana-dashboard.yaml  # Grafana dashboard ConfigMap (auto-loaded by the kube-prometheus-stack sidecar)
  - sealedsecret.yaml  # generated by homelab/scripts/seal-budget-sync-secrets.sh (produces Secret budget-sync-secrets)
