apiVersion: v1
kind: ConfigMap
metadata:
  name: budget-sync-config
data:
  # --- Queue / runtime topology (monolith: server + worker + scheduler) ---
  QUEUE_DRIVER: "redis"
  RUN_WORKER: "true"
  # SHADOW DEFAULT: scheduler OFF. While GCP is still the active deployment, the
  # Jetson must NOT run the 3-hourly sync (it would double-run against the shared
  # Neon DB and, worse, re-register the Monobank webhook to WEBHOOK_URL).
  # CUTOVER (2026-05-31): Jetson is now ACTIVE. GCP Cloud Scheduler is paused and
  # the Monobank webhook points at the Jetson Funnel URL (below). Only one side
  # may be active at a time — to revert, set this back to "false", re-register the
  # GCP webhook, and `gcloud scheduler jobs resume sync-accounts-scheduler`.
  RUN_SCHEDULER: "true"
  REDIS_URL: "redis://budget-sync-redis:6379"

  # --- Scheduler ---
  # Account sync every 3 hours.
  SCHEDULER_SYNC_CRON: "0 */3 * * *"

  # --- Server ---
  PORT: "8080"

  # --- Observability ---
  METRICS_ENABLED: "true"

  # --- Webhook re-registration target (Monobank webhook) ---
  # Tailscale Funnel public URL on :8443 (NOT :443 — :443 is owned by ingress-nginx
  # for the *.lab sites; Funnel on :8443 coexists). Funnel scopes the public path
  # to /webhook only → budget-sync-webhook NodePort 30081. The scheduler re-registers
  # this with Monobank on each 3-hourly sync.
  WEBHOOK_URL: "https://ubuntu.tailea9b10.ts.net:8443/webhook"
