apiVersion: apps/v1
kind: Deployment
metadata:
  name: budget-sync
  labels:
    app: budget-sync
spec:
  replicas: 1
  # The monolith runs the BullMQ worker AND the account-sync scheduler in the
  # same process. These MUST be a singleton (two schedulers would double-fire
  # syncs, two worker sets would compete). Recreate (not RollingUpdate) ensures
  # the old pod is torn down before the new one starts, so there is never more
  # than one scheduler/worker live at a time.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: budget-sync
  template:
    metadata:
      labels:
        app: budget-sync
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: budget-sync
          image: ghcr.io/yuriiholiuk/budget-sync:main
          # ENTRYPOINT is ["bun","run"]; override args to launch the monolith.
          args: ["src/jobs/monolith.ts"]
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: budget-sync-config
            - secretRef:
                name: budget-sync-secrets
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 15
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
