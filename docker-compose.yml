# Docker Compose for local development
#
# Usage:
#   docker compose up -d --wait    # Start everything and wait for healthy
#   docker compose down            # Stop all services
#   docker compose down -v         # Stop and remove volumes (reset DB)

name: budget-sync-dev

services:
  db:
    image: postgres:16-alpine
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: budget_sync
      POSTGRES_PASSWORD: budget_sync
      POSTGRES_DB: budget_sync
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U budget_sync"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  db-migrate:
    build:
      context: .
      target: builder
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      DATABASE_URL: postgresql://budget_sync:budget_sync@db:5432/budget_sync
    depends_on:
      db:
        condition: service_healthy
    command: ["bunx", "drizzle-kit", "migrate"]

  db-seed:
    build:
      context: .
      target: builder
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      DATABASE_URL: postgresql://budget_sync:budget_sync@db:5432/budget_sync
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    command: ["bun", "scripts/seed-if-empty.ts"]

  api:
    build:
      context: .
      target: builder
    working_dir: /app
    ports:
      - "4001:4001"
    volumes:
      - .:/app
      - /app/node_modules
    env_file: .env
    environment:
      DATABASE_URL: postgresql://budget_sync:budget_sync@db:5432/budget_sync
      PORT: "4001"
    depends_on:
      db:
        condition: service_healthy
      db-seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "bun", "--eval", "const r = await fetch('http://localhost:4001/health'); process.exit(r.ok ? 0 : 1)"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
    command: ["bun", "run", "--watch", "src/server.ts"]

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      target: deps
    working_dir: /app/web
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/web/node_modules
      - /app/web/.next
    environment:
      API_URL: http://api:4001
      WATCHPACK_POLLING: "true"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bun", "--eval", "const r = await fetch('http://localhost:3000'); process.exit(r.ok ? 0 : 1)"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 10s
    command: ["sh", "-c", "bun run codegen && bun run dev"]

  budget-sync:
    profiles: ["legacy"]
    build: .
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ${GOOGLE_SERVICE_ACCOUNT_FILE}:/secrets/google-sa.json:ro
    environment:
      - GOOGLE_SERVICE_ACCOUNT_FILE=/secrets/google-sa.json
    command: ["sync-transactions"]

volumes:
  pgdata:
