mutation CreateBudget($input: CreateBudgetInput!) {
  createBudget(input: $input) {
    id
    name
    currency
    targetAmount
    cadenceUnit
    cadenceCount
    targetDate
    startDate
    endDate
    isArchived
    cap
    sortOrder
    budgetGroupId
  }
}

mutation UpdateBudget($input: UpdateBudgetInput!) {
  updateBudget(input: $input) {
    id
    name
    currency
    targetAmount
    cadenceUnit
    cadenceCount
    targetDate
    startDate
    endDate
    isArchived
    cap
    sortOrder
    budgetGroupId
  }
}

mutation ArchiveBudget($id: Int!) {
  archiveBudget(id: $id) {
    id
    name
    isArchived
  }
}

mutation ReorderBudget($input: ReorderBudgetInput!) {
  reorderBudget(input: $input) {
    id
    sortOrder
    budgetGroupId
  }
}
