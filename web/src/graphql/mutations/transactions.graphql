mutation UpdateTransactionCategory($input: UpdateTransactionCategoryInput!) {
  updateTransactionCategory(input: $input) {
    id
    category {
      id
      name
      fullPath
    }
    categorizationStatus
  }
}

mutation UpdateTransactionBudget($input: UpdateTransactionBudgetInput!) {
  updateTransactionBudget(input: $input) {
    id
    budget {
      id
      name
    }
    categorizationStatus
  }
}

mutation UpdateTransactionNotes($input: UpdateTransactionNotesInput!) {
  updateTransactionNotes(input: $input) {
    id
    notes
  }
}

mutation VerifyTransaction($id: Int!) {
  verifyTransaction(id: $id) {
    id
    categorizationStatus
  }
}

mutation BatchUpdateTransactions($input: BatchUpdateTransactionsInput!) {
  batchUpdateTransactions(input: $input) {
    updatedCount
    transactions {
      id
      categorizationStatus
      category {
        id
        name
        fullPath
      }
      budget {
        id
        name
      }
    }
  }
}

mutation CreateTransaction($input: CreateTransactionInput!) {
  createTransaction(input: $input) {
    id
    date
    amount
    currency
    type
    description
    counterpartyName
    notes
    categorizationStatus
    account {
      id
      name
    }
  }
}

mutation DeleteTransaction($id: Int!) {
  deleteTransaction(id: $id)
}

mutation ConvertToTransfer($input: ConvertToTransferInput!) {
  convertToTransfer(input: $input) {
    sourceTransaction {
      id
      type
      transferPair {
        pairedTransactionId
        pairedAccountName
        isRevertible
      }
    }
    counterpartTransaction {
      id
      date
      amount
      currency
      type
      description
      counterpartyName
      counterpartyIban
      mcc
      categorizationStatus
      categoryReason
      budgetReason
      notes
      bankTransactionCount
      category {
        id
        name
        fullPath
      }
      budget {
        id
        name
      }
      account {
        id
        name
      }
    }
  }
}

mutation RevertTransfer($transactionId: Int!) {
  revertTransfer(transactionId: $transactionId) {
    id
    type
  }
}

mutation MarkAsReturning($input: MarkAsReturningInput!) {
  markAsReturning(input: $input) {
    type
    survivingTransaction {
      id
      amount
      type
      bankTransactionCount
    }
    newSurvivingAmount
    totalDebitAmount
    totalCreditAmount
  }
}

mutation RevertReturning($transactionId: Int!) {
  revertReturning(transactionId: $transactionId) {
    transaction {
      id
      amount
      type
      bankTransactionCount
      returningInfo {
        isRevertible
        returningAmount
      }
    }
    createdTransactions {
      id
      date
      amount
      currency
      type
      description
      counterpartyName
      counterpartyIban
      mcc
      categorizationStatus
      categoryReason
      budgetReason
      notes
      bankTransactionCount
      category {
        id
        name
        fullPath
      }
      budget {
        id
        name
      }
      account {
        id
        name
      }
    }
  }
}

