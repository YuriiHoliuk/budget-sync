query GetMonthlyOverview($month: String!) {
  monthlyOverview(month: $month) {
    month
    readyToAssign
    totalAllocated
    totalSpent
    capitalBalance
    availableFunds
    savingsRate
    budgetSummaries {
      budgetId
      name
      targetAmount
      allocated
      spent
      available
      suggestedAllocation
      isExpired
      sortOrder
      budgetGroupId
    }
    budgetGroups {
      id
      name
      sortOrder
    }
  }
}
