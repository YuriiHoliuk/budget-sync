query GetBudget($id: Int!) {
  budget(id: $id) {
    id
    name
    currency
    targetAmount
    cadenceUnit
    cadenceCount
    targetDate
    startDate
    endDate
    isArchived
    cap
    sortOrder
    budgetGroupId
  }
}

query GetBudgets($activeOnly: Boolean = false) {
  budgets(activeOnly: $activeOnly) {
    id
    name
    currency
    targetAmount
    cadenceUnit
    cadenceCount
    targetDate
    startDate
    endDate
    isArchived
    cap
    sortOrder
    budgetGroupId
    transactionCount
  }
}
