query GetTransactions(
  $filter: TransactionFilter
  $pagination: PaginationInput
) {
  transactions(filter: $filter, pagination: $pagination) {
    items {
      id
      date
      amount
      currency
      type
      description
      counterpartyName
      counterpartyIban
      mcc
      categorizationStatus
      categoryReason
      budgetReason
      notes
      bankTransactionCount
      category {
        id
        name
        fullPath
      }
      budget {
        id
        name
      }
      account {
        id
        name
      }
    }
    totalCount
    hasMore
  }
}

query GetTransaction($id: Int!) {
  transaction(id: $id) {
    id
    date
    amount
    currency
    type
    description
    counterpartyName
    counterpartyIban
    mcc
    categorizationStatus
    categoryReason
    budgetReason
    notes
    bankTransactionCount
    category {
      id
      name
      fullPath
    }
    budget {
      id
      name
    }
    account {
      id
      name
      source
    }
    transferPair {
      pairedTransactionId
      pairedAccountName
      isRevertible
    }
    returningInfo {
      isRevertible
      returningAmount
    }
    bankTransactions {
      id
      externalId
      date
      amount
      currency
      type
      mcc
      bankDescription
      counterparty
      counterpartyIban
      balanceAfter
      cashback
      commission
      hold
      receiptId
      returnHistory {
        originalBankTransactionId
        returningBankTransactionId
        amount
        createdAt
      }
    }
    siblingTransactions {
      id
      amount
      currency
      description
      category {
        id
        name
        fullPath
      }
      budget {
        id
        name
      }
    }
  }
}
