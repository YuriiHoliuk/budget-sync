name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  PROJECT_ID: budget-sync-483105
  REGION: europe-central2
  REPOSITORY: budget-sync

jobs:
  # ── CI ──────────────────────────────────────────────────────────────
  test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install web dependencies
        run: cd web && bun install --frozen-lockfile

      - name: Generate GraphQL types
        run: cd web && bun run codegen

      - name: Typecheck
        run: bun run typecheck

      - name: Typecheck web
        run: cd web && bun run tsc --noEmit

      - name: Lint
        run: bun run check

      - name: Lint web
        run: cd web && bun run lint

      - name: Unit tests
        run: bun test tests/unit

  test-api:
    name: API Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: budget_sync_test
          POSTGRES_PASSWORD: budget_sync_test
          POSTGRES_DB: budget_sync_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U budget_sync_test"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://budget_sync_test:budget_sync_test@localhost:5433/budget_sync_test
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run migrations
        run: bunx drizzle-kit migrate

      - name: Run API integration tests
        run: bun test tests/integration/api

  test-e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Start E2E environment
        run: docker compose -f docker-compose.e2e.yml up -d --wait
        timeout-minutes: 5

      - name: Warm up Next.js dev server
        run: |
          echo "Pre-compiling pages..."
          for path in / /budgets/2026-02 /transactions /accounts /categories; do
            for i in 1 2 3; do
              if curl -sf "http://localhost:3001${path}" > /dev/null 2>&1; then
                echo "  ✓ ${path}"
                break
              fi
              echo "  Retry ${i}/3 for ${path}..."
              sleep 3
            done
          done
          echo "Verifying GraphQL proxy..."
          curl -sf http://localhost:3001/api/graphql \
            -H 'Content-Type: application/json' \
            -d '{"query":"{ __typename }"}' > /dev/null
          echo "All pages compiled and API proxy verified"

      - name: Run E2E tests
        run: bunx playwright test --retries=1
        env:
          CI: true

      - name: Debug E2E environment
        if: failure()
        run: |
          echo "=== Docker container status ==="
          docker compose -f docker-compose.e2e.yml ps
          echo ""
          echo "=== web-e2e logs (last 50 lines) ==="
          docker compose -f docker-compose.e2e.yml logs --tail=50 web-e2e
          echo ""
          echo "=== api-e2e logs (last 20 lines) ==="
          docker compose -f docker-compose.e2e.yml logs --tail=20 api-e2e

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-results
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7

      - name: Stop E2E environment
        if: always()
        run: docker compose -f docker-compose.e2e.yml down -v

  # ── Deploy (main only) ─────────────────────────────────────────────
  check:
    name: Check Changes
    runs-on: ubuntu-latest
    needs: [test, test-api, test-e2e]
    if: github.event_name != 'pull_request'
    outputs:
      should_deploy_backend: ${{ steps.filter.outputs.should_deploy_backend }}
      should_deploy_web: ${{ steps.filter.outputs.should_deploy_web }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Get deployed backend SHA
        id: backend_sha
        run: |
          IMAGE_TAG=$(gcloud run services describe webhook \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }} \
            --format='value(spec.template.spec.containers[0].image)' 2>/dev/null || echo "")

          SHA=$(echo "$IMAGE_TAG" | grep -oE '[0-9a-f]{40}$' || echo "")

          if [ -n "$SHA" ] && git cat-file -e "$SHA" 2>/dev/null; then
            echo "sha=$SHA" >> $GITHUB_OUTPUT
            echo "Deployed backend SHA: $SHA"
          else
            echo "sha=" >> $GITHUB_OUTPUT
            echo "Could not resolve deployed backend SHA (tag: ${IMAGE_TAG:-none}), will deploy"
          fi

      - name: Get deployed web SHA
        id: web_sha
        run: |
          IMAGE_TAG=$(gcloud run services describe web \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }} \
            --format='value(spec.template.spec.containers[0].image)' 2>/dev/null || echo "")

          SHA=$(echo "$IMAGE_TAG" | grep -oE '[0-9a-f]{40}$' || echo "")

          if [ -n "$SHA" ] && git cat-file -e "$SHA" 2>/dev/null; then
            echo "sha=$SHA" >> $GITHUB_OUTPUT
            echo "Deployed web SHA: $SHA"
          else
            echo "sha=" >> $GITHUB_OUTPUT
            echo "Could not resolve deployed web SHA (tag: ${IMAGE_TAG:-none}), will deploy"
          fi

      - name: Check for changes
        id: filter
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual dispatch — deploying all"
            echo "should_deploy_backend=true" >> $GITHUB_OUTPUT
            echo "should_deploy_web=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          BACKEND_SHA="${{ steps.backend_sha.outputs.sha }}"
          if [ -n "$BACKEND_SHA" ]; then
            BACKEND_CHANGED=$(git diff --name-only "$BACKEND_SHA" HEAD 2>/dev/null || echo "DIFF_FAILED")
          else
            BACKEND_CHANGED="DIFF_FAILED"
          fi

          if [ "$BACKEND_CHANGED" = "DIFF_FAILED" ]; then
            echo "should_deploy_backend=true" >> $GITHUB_OUTPUT
            echo "Backend: deploying (no deployed SHA to compare)"
          elif echo "$BACKEND_CHANGED" | grep -qE '^(src/|drizzle/|package\.json|bun\.lock|Dockerfile|tsconfig\.json)'; then
            echo "should_deploy_backend=true" >> $GITHUB_OUTPUT
            echo "Backend files changed since deployed commit, will deploy"
          else
            echo "should_deploy_backend=false" >> $GITHUB_OUTPUT
            echo "No backend files changed since deployed commit"
          fi

          WEB_SHA="${{ steps.web_sha.outputs.sha }}"
          if [ -n "$WEB_SHA" ]; then
            WEB_CHANGED=$(git diff --name-only "$WEB_SHA" HEAD 2>/dev/null || echo "DIFF_FAILED")
          else
            WEB_CHANGED="DIFF_FAILED"
          fi

          if [ "$WEB_CHANGED" = "DIFF_FAILED" ]; then
            echo "should_deploy_web=true" >> $GITHUB_OUTPUT
            echo "Web: deploying (no deployed SHA to compare)"
          elif echo "$WEB_CHANGED" | grep -qE '^(src/|web/|package\.json|bun\.lock|docker/|Dockerfile\.web|tsconfig\.json)'; then
            echo "should_deploy_web=true" >> $GITHUB_OUTPUT
            echo "Web app files changed since deployed commit, will deploy"
          else
            echo "should_deploy_web=false" >> $GITHUB_OUTPUT
            echo "No web app files changed since deployed commit"
          fi

  migrate:
    name: Migrate Database
    runs-on: ubuntu-latest
    needs: check
    if: needs.check.outputs.should_deploy_backend == 'true' || needs.check.outputs.should_deploy_web == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Run migrations
        run: |
          DATABASE_URL=$(gcloud secrets versions access latest --secret=database-url --project=${{ env.PROJECT_ID }})
          DATABASE_URL="$DATABASE_URL" bunx drizzle-kit migrate

  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    needs: check
    if: needs.check.outputs.should_deploy_backend == 'true'
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Set image tag
        id: meta
        run: |
          REGISTRY="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}"
          echo "image=${REGISTRY}/budget-sync:${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Build and push
        run: |
          docker build -t ${{ steps.meta.outputs.image }} .
          docker push ${{ steps.meta.outputs.image }}

  build-web:
    name: Build Web App
    runs-on: ubuntu-latest
    needs: check
    if: needs.check.outputs.should_deploy_web == 'true'
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Get webhook service URL
        id: webhook
        run: |
          WEBHOOK_URL=$(gcloud run services describe webhook \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }} \
            --format='value(status.url)' 2>/dev/null || echo "")
          if [ -z "$WEBHOOK_URL" ]; then
            echo "Warning: webhook service not found, using placeholder URL"
            WEBHOOK_URL="http://localhost:4001"
          fi
          echo "url=${WEBHOOK_URL}" >> $GITHUB_OUTPUT

      - name: Set image tag
        id: meta
        run: |
          REGISTRY="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}"
          echo "image=${REGISTRY}/budget-sync-web:${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Build and push
        run: |
          docker build \
            -f Dockerfile.web \
            --build-arg NEXT_PUBLIC_ALLOWED_EMAIL="${{ secrets.ALLOWED_EMAIL }}" \
            --build-arg NEXT_PUBLIC_ALLOWED_PASSWORD="${{ secrets.ALLOWED_PASSWORD }}" \
            --build-arg API_URL="${{ steps.webhook.outputs.url }}" \
            -t ${{ steps.meta.outputs.image }} \
            .
          docker push ${{ steps.meta.outputs.image }}

  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest
    needs: [check, build-backend, migrate]
    if: needs.check.outputs.should_deploy_backend == 'true'
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy sync-accounts job
        run: |
          gcloud run jobs update sync-accounts \
            --image=${{ needs.build-backend.outputs.image }} \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }}

      - name: Deploy webhook service
        run: |
          gcloud run services update webhook \
            --image=${{ needs.build-backend.outputs.image }} \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }}
          gcloud run services update-traffic webhook \
            --to-latest \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }}

  deploy-web:
    name: Deploy Web App
    runs-on: ubuntu-latest
    needs: [check, build-web, migrate]
    if: needs.check.outputs.should_deploy_web == 'true'
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy web service
        run: |
          gcloud run services update web \
            --image=${{ needs.build-web.outputs.image }} \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }}
          gcloud run services update-traffic web \
            --to-latest \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }}

  cleanup:
    name: Cleanup
    runs-on: ubuntu-latest
    needs: [check, deploy-backend, deploy-web]
    if: always() && (needs.deploy-backend.result == 'success' || needs.deploy-web.result == 'success')
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Cleanup old backend images
        if: needs.deploy-backend.result == 'success'
        run: |
          REPO="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/budget-sync"
          gcloud artifacts docker images list "$REPO" \
            --sort-by=CREATE_TIME \
            --format="value(version)" | \
          head -n -2 | \
          while read -r digest; do
            if [ -n "$digest" ]; then
              echo "Deleting old image: $digest"
              gcloud artifacts docker images delete "${REPO}@${digest}" --delete-tags --quiet || true
            fi
          done

      - name: Cleanup old web images
        if: needs.deploy-web.result == 'success'
        run: |
          REPO="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/budget-sync-web"
          gcloud artifacts docker images list "$REPO" \
            --sort-by=CREATE_TIME \
            --format="value(version)" | \
          head -n -2 | \
          while read -r digest; do
            if [ -n "$digest" ]; then
              echo "Deleting old image: $digest"
              gcloud artifacts docker images delete "${REPO}@${digest}" --delete-tags --quiet || true
            fi
          done

  summary:
    name: Summary
    runs-on: ubuntu-latest
    needs: [check, build-backend, build-web, deploy-backend, deploy-web]
    if: always() && github.event_name != 'pull_request'
    steps:
      - name: Deployment Summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### Backend" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.deploy-backend.result }}" = "success" ]; then
            echo "- **Image:** ${{ needs.build-backend.outputs.image }}" >> $GITHUB_STEP_SUMMARY
            echo "- **Status:** ✅ Deployed" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.check.outputs.should_deploy_backend }}" = "false" ]; then
            echo "- **Status:** ⏭️ Skipped (no changes)" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Status:** ❌ Failed" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### Web App" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.deploy-web.result }}" = "success" ]; then
            echo "- **Image:** ${{ needs.build-web.outputs.image }}" >> $GITHUB_STEP_SUMMARY
            echo "- **Status:** ✅ Deployed" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.check.outputs.should_deploy_web }}" = "false" ]; then
            echo "- **Status:** ⏭️ Skipped (no changes)" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Status:** ❌ Failed" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### Resources" >> $GITHUB_STEP_SUMMARY
          echo "- **Region:** ${{ env.REGION }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Project:** ${{ env.PROJECT_ID }}" >> $GITHUB_STEP_SUMMARY
