name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install web dependencies
        run: cd web && bun install --frozen-lockfile

      - name: Generate GraphQL types
        run: cd web && bun run codegen

      - name: Typecheck
        run: bun run typecheck

      - name: Typecheck web
        run: cd web && bun run tsc --noEmit

      - name: Lint
        run: bun run check

      - name: Lint web
        run: cd web && bun run lint

      - name: Unit tests
        run: bun test tests/unit

  test-api:
    name: API Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: budget_sync_test
          POSTGRES_PASSWORD: budget_sync_test
          POSTGRES_DB: budget_sync_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U budget_sync_test"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://budget_sync_test:budget_sync_test@localhost:5433/budget_sync_test
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run migrations
        run: bunx drizzle-kit migrate

      - name: Run API integration tests
        run: bun test tests/integration/api

  test-e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Start E2E environment
        run: docker compose -f docker-compose.e2e.yml up -d

      - name: Wait for services to be ready
        run: |
          echo "Waiting for web-e2e to be healthy..."
          timeout 300 bash -c 'until curl -sf http://localhost:3001 > /dev/null 2>&1; do sleep 3; done'
          echo "Services are ready"

      - name: Debug E2E environment
        if: always()
        run: |
          echo "=== Docker container status ==="
          docker compose -f docker-compose.e2e.yml ps
          echo ""
          echo "=== web-e2e env vars ==="
          docker compose -f docker-compose.e2e.yml exec -T web-e2e printenv | grep -E "NEXT_PUBLIC|NODE_ENV|API_URL" || echo "Could not read env vars"
          echo ""
          echo "=== Curl homepage ==="
          curl -sI http://localhost:3001 || echo "Failed to reach web"
          echo ""
          echo "=== Curl homepage body (first 200 lines) ==="
          curl -s http://localhost:3001 | head -200
          echo ""
          echo "=== web-e2e logs (last 30 lines) ==="
          docker compose -f docker-compose.e2e.yml logs --tail=30 web-e2e
          echo ""
          echo "=== api-e2e logs (last 15 lines) ==="
          docker compose -f docker-compose.e2e.yml logs --tail=15 api-e2e

      - name: Run E2E tests
        run: bunx playwright test e2e/tests/smoke/navigation.spec.ts --retries=0
        env:
          CI: true

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-results
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7

      - name: Stop E2E environment
        if: always()
        run: docker compose -f docker-compose.e2e.yml down -v
