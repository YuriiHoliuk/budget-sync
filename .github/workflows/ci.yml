name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install web dependencies
        run: cd web && bun install --frozen-lockfile

      - name: Generate GraphQL types
        run: cd web && bun run codegen

      - name: Typecheck
        run: bun run typecheck

      - name: Typecheck web
        run: cd web && bun run tsc --noEmit

      - name: Lint
        run: bun run check

      - name: Lint web
        run: cd web && bun run lint

      - name: Unit tests
        run: bun test tests/unit

  test-api:
    name: API Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: budget_sync_test
          POSTGRES_PASSWORD: budget_sync_test
          POSTGRES_DB: budget_sync_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U budget_sync_test"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://budget_sync_test:budget_sync_test@localhost:5433/budget_sync_test
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run migrations
        run: bunx drizzle-kit migrate

      - name: Run API integration tests
        run: bun test tests/integration/api

  test-e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Start E2E environment
        run: docker compose -f docker-compose.e2e.yml up -d --wait
        timeout-minutes: 5

      - name: Warm up Next.js dev server
        run: |
          echo "Pre-compiling pages..."
          curl -sf http://localhost:3001/ > /dev/null
          curl -sf http://localhost:3001/budgets/2026-02 > /dev/null
          curl -sf http://localhost:3001/transactions > /dev/null
          curl -sf http://localhost:3001/accounts > /dev/null
          curl -sf http://localhost:3001/categories > /dev/null
          echo "Verifying GraphQL proxy..."
          curl -sf http://localhost:3001/api/graphql \
            -H 'Content-Type: application/json' \
            -d '{"query":"{ __typename }"}' > /dev/null
          echo "All pages compiled and API proxy verified"

      - name: Run E2E tests
        run: bunx playwright test --retries=1
        env:
          CI: true

      - name: Debug E2E environment
        if: failure()
        run: |
          echo "=== Docker container status ==="
          docker compose -f docker-compose.e2e.yml ps
          echo ""
          echo "=== web-e2e logs (last 50 lines) ==="
          docker compose -f docker-compose.e2e.yml logs --tail=50 web-e2e
          echo ""
          echo "=== api-e2e logs (last 20 lines) ==="
          docker compose -f docker-compose.e2e.yml logs --tail=20 api-e2e

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-results
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7

      - name: Stop E2E environment
        if: always()
        run: docker compose -f docker-compose.e2e.yml down -v
