extend type Query {
  """
  Get transactions with optional filters and pagination.
  Returns paginated results with total count.
  """
  transactions(filter: TransactionFilter, pagination: PaginationInput): TransactionConnection!

  """
  Get a single transaction by its database ID.
  """
  transaction(id: Int!): Transaction
}

extend type Mutation {
  """
  Create a transaction on a manual (non-synced) account.
  Synced accounts can only receive transactions via bank sync.
  """
  createTransaction(input: CreateTransactionInput!): Transaction!

  """
  Delete a transaction on a manual (non-synced) account.
  Bank-synced accounts cannot have their transactions deleted manually.
  """
  deleteTransaction(id: Int!): Boolean!

  """
  Update the category of a transaction.
  """
  updateTransactionCategory(input: UpdateTransactionCategoryInput!): Transaction!

  """
  Update the budget of a transaction.
  """
  updateTransactionBudget(input: UpdateTransactionBudgetInput!): Transaction!

  """
  Update the notes of a transaction.
  """
  updateTransactionNotes(input: UpdateTransactionNotesInput!): Transaction!

  """
  Mark a transaction as verified (user confirmed categorization).
  """
  verifyTransaction(id: Int!): Transaction!

  """
  Mark two transactions as a transfer pair. Sets both to type TRANSFER
  and creates a transfer_pairs record.
  """
  markAsTransfer(outgoingTransactionId: Int!, incomingTransactionId: Int!): Boolean!

  """
  Unmark a transfer pair. Reverts both transactions to their original type
  (based on amount sign) and removes the transfer_pairs record.
  """
  unmarkTransfer(outgoingTransactionId: Int!, incomingTransactionId: Int!): Boolean!

  """
  Convert a DEBIT or CREDIT transaction to a TRANSFER by creating a counterpart
  transaction on a manual account, linking them as a transfer pair, and adjusting
  the destination account balance.
  """
  convertToTransfer(input: ConvertToTransferInput!): ConvertToTransferResult!

  """
  Revert a manually-converted transfer back to its original type.
  Deletes the counterpart transaction, removes the transfer pair,
  and restores the destination account balance.
  """
  revertTransfer(transactionId: Int!): Transaction!

  """
  Pair a credit (refund/compensation) with a debit (expense) to cancel or reduce them.
  Works across accounts. Outcomes based on amount comparison:
    - credit == debit → both deleted (full_cancel)
    - credit < debit → credit deleted, debit reduced (debit_reduced)
    - credit > debit → debit deleted, credit reduced (credit_reduced)
  Deleted side's bank transactions are re-linked to the surviving transaction.
  """
  markAsReturning(input: MarkAsReturningInput!): MarkAsReturningResult!

  """
  Revert a reduction. Unlinks foreign bank transactions from the surviving transaction,
  re-creates them as standalone transactions on their origin accounts, and restores
  the surviving transaction's amount. Works for both debit_reduced and credit_reduced.
  """
  revertReturning(transactionId: Int!): RevertReturningResult!

  """
  Split a transaction into multiple parts. The original transaction is replaced
  by the split parts, which must sum to the original amount.
  """
  splitTransaction(input: SplitTransactionInput!): SplitTransactionResult!

  """
  Join a split transaction back into its parent. Merges the source transaction
  back into the target transaction.
  """
  joinTransactions(input: JoinTransactionsInput!): Transaction!

  """
  Update category, budget, and/or verification status for multiple transactions
  in a single atomic operation. At least one of setCategory, setBudget, verify
  must be provided; otherwise the mutation rejects.
  """
  batchUpdateTransactions(input: BatchUpdateTransactionsInput!): BatchUpdateTransactionsResult!

}

input TransactionFilter {
  """
  Filter by account database ID.
  """
  accountId: Int

  """
  Filter by category database ID.
  """
  categoryId: Int

  """
  If true, filter for transactions with no category assigned (categoryId IS NULL).
  Takes precedence over categoryId filter.
  """
  uncategorizedOnly: Boolean

  """
  Filter by budget database ID.
  """
  budgetId: Int

  """
  If true, filter for transactions with no budget assigned (budgetId IS NULL).
  Takes precedence over budgetId filter.
  """
  unbudgetedOnly: Boolean

  """
  Filter by account role (operational or savings).
  """
  accountRole: AccountRole

  """
  Filter by transaction type (CREDIT or DEBIT).
  """
  type: TransactionTypeEnum

  """
  Filter by categorization status.
  """
  categorizationStatus: CategorizationStatusEnum

  """
  Start date for date range filter (ISO date string, inclusive).
  """
  dateFrom: String

  """
  End date for date range filter (ISO date string, inclusive).
  """
  dateTo: String

  """
  Search text (matches description or counterparty).
  """
  search: String
}

input PaginationInput {
  """
  Number of items per page. Defaults to 50.
  """
  limit: Int

  """
  Offset for pagination. Defaults to 0.
  """
  offset: Int
}

input UpdateTransactionCategoryInput {
  """
  Transaction database ID.
  """
  id: Int!

  """
  Category database ID. Pass null to remove category.
  """
  categoryId: Int
}

input UpdateTransactionBudgetInput {
  """
  Transaction database ID.
  """
  id: Int!

  """
  Budget database ID. Pass null to remove budget.
  """
  budgetId: Int
}

input UpdateTransactionNotesInput {
  """
  Transaction database ID.
  """
  id: Int!

  """
  Notes text. Pass null to clear notes.
  """
  notes: String
}

input CreateTransactionInput {
  """
  Account database ID. Must be a manual (non-synced) account.
  """
  accountId: Int!

  """
  Transaction date as ISO date string (e.g., "2024-01-15").
  """
  date: String!

  """
  Amount in major units (e.g., 100.50). Always positive.
  """
  amount: Float!

  """
  Transaction type: CREDIT for income, DEBIT for expense.
  """
  type: TransactionTypeEnum!

  """
  Description of the transaction.
  """
  description: String!

  """
  Optional counterparty name.
  """
  counterpartyName: String

  """
  Optional counterparty IBAN.
  """
  counterpartyIban: String

  """
  Optional MCC (Merchant Category Code).
  """
  mcc: Int

  """
  Optional notes about the transaction.
  """
  notes: String
}

type TransactionConnection {
  items: [Transaction!]!
  totalCount: Int!
  hasMore: Boolean!
}

type Transaction {
  id: Int!
  date: String!
  """
  Amount in major units (always positive).
  """
  amount: Float!
  currency: String!
  type: TransactionTypeEnum!
  description: String!
  categorizationStatus: CategorizationStatusEnum!
  categoryReason: String
  budgetReason: String
  mcc: Int
  counterpartyName: String
  counterpartyIban: String
  notes: String

  """
  How many bank_transactions are linked to this transaction via transaction_sources.
  """
  bankTransactionCount: Int!

  """
  The linked bank transactions (via transaction_sources join table).
  """
  bankTransactions: [BankTransaction!]!

  """
  Account this transaction belongs to.
  """
  account: Account

  """
  Assigned category (null if uncategorized).
  """
  category: Category

  """
  Assigned budget (null if unbudgeted).
  """
  budget: Budget

  """
  Transfer pair info (null if not a transfer).
  """
  transferPair: TransferPairInfo

  """
  Returning/refund info (null if no returns linked to this debit transaction).
  """
  returningInfo: ReturningInfo

  """
  Sibling transactions from the same split group (empty if not a split transaction).
  """
  siblingTransactions: [SiblingTransaction!]!
}

enum TransactionTypeEnum {
  CREDIT
  DEBIT
  TRANSFER
}

type BankTransaction {
  id: Int!
  externalId: String!
  date: String!
  amount: Float!
  currency: String!
  type: String!
  mcc: Int
  bankDescription: String
  counterparty: String
  counterpartyIban: String
  balanceAfter: Float
  cashback: Float
  commission: Float
  hold: Boolean
  receiptId: String
  returnHistory: [BankTransactionReturn!]!
}

type BankTransactionReturn {
  originalBankTransactionId: Int!
  returningBankTransactionId: Int!
  amount: Float!
  createdAt: String!
}

enum CategorizationStatusEnum {
  PENDING
  CATEGORIZED
  VERIFIED
}

input ConvertToTransferInput {
  """
  Transaction database ID to convert.
  """
  transactionId: Int!

  """
  Destination manual account database ID.
  """
  destinationAccountId: Int!
}

type ConvertToTransferResult {
  sourceTransaction: Transaction!
  counterpartTransaction: Transaction!
}

type TransferPairInfo {
  """
  Database ID of the paired transaction.
  """
  pairedTransactionId: Int!

  """
  Name of the paired transaction's account.
  """
  pairedAccountName: String

  """
  Whether this transfer can be reverted (only manually-converted transfers).
  """
  isRevertible: Boolean!
}

input MarkAsReturningInput {
  """
  Database IDs of the credit (refund/compensation) transactions. One of the
  two sides must have exactly one entry (the "anchor" that survives); the
  other may have one or more. Passing arrays with more than one entry on
  both sides is rejected.
  """
  creditTransactionIds: [Int!]!

  """
  Database IDs of the debit (expense) transactions. See creditTransactionIds.
  """
  debitTransactionIds: [Int!]!
}

type MarkAsReturningResult {
  """
  Which outcome was produced by the pairing.
  """
  type: ReturningType!

  """
  The surviving transaction after update (null for full_cancel — both deleted).
  """
  survivingTransaction: Transaction

  """
  New amount in major units on the surviving transaction (null for full_cancel).
  """
  newSurvivingAmount: Float

  """
  Sum of debit transactions in major units (before pairing).
  """
  totalDebitAmount: Float!

  """
  Sum of credit transactions in major units (before pairing).
  """
  totalCreditAmount: Float!
}

enum ReturningType {
  FULL_CANCEL
  DEBIT_REDUCED
  CREDIT_REDUCED
}

"""
Info about foreign bank transactions (opposite-type) linked to this transaction.
Present for both debit_reduced survivors (credit bank_txs linked to a debit) and
credit_reduced survivors (debit bank_txs linked to a credit).
"""
type ReturningInfo {
  """
  Whether this pairing can be reverted (always true when this info is present).
  """
  isRevertible: Boolean!

  """
  Total absolute amount of foreign bank transactions in major units.
  """
  returningAmount: Float!
}

type RevertReturningResult {
  """
  The surviving transaction with restored amount.
  """
  transaction: Transaction!

  """
  Newly created transactions (one per unlinked foreign bank transaction),
  resurrected on their original accounts.
  """
  createdTransactions: [Transaction!]!
}

input SplitTransactionInput {
  """
  Database ID of the transaction to split.
  """
  transactionId: Int!

  """
  Parts to split the transaction into. Amounts must sum to the original.
  """
  parts: [SplitPartInput!]!
}

input SplitPartInput {
  """
  Amount in major units (e.g., 100.50). Always positive.
  """
  amount: Float!

  """
  Optional description for the split part.
  """
  description: String

  """
  Optional category database ID.
  """
  categoryId: Int

  """
  Optional budget database ID.
  """
  budgetId: Int

  """
  Optional notes for the split part.
  """
  notes: String
}

input JoinTransactionsInput {
  """
  Database ID of the target transaction to merge into.
  """
  targetTransactionId: Int!

  """
  Database ID of the source transaction to merge from.
  """
  sourceTransactionId: Int!
}

input BatchUpdateTransactionsInput {
  """
  Transaction database IDs to update. Must not be empty.
  """
  ids: [Int!]!

  """
  Category database ID to apply when setCategory is true. Pass null together
  with setCategory=true to clear the category.
  """
  categoryId: Int

  """
  When true, apply categoryId (including null) to every selected transaction.
  Omit or pass false to leave category untouched.
  """
  setCategory: Boolean

  """
  Budget database ID to apply when setBudget is true. Pass null together with
  setBudget=true to clear the budget.
  """
  budgetId: Int

  """
  When true, apply budgetId (including null) to every selected transaction.
  Omit or pass false to leave budget untouched.
  """
  setBudget: Boolean

  """
  When true, set categorizationStatus=VERIFIED on every selected transaction.
  """
  verify: Boolean
}

type BatchUpdateTransactionsResult {
  """
  Number of transactions updated by the single UPDATE statement.
  """
  updatedCount: Int!

  """
  The updated transactions, re-fetched with their new state.
  """
  transactions: [Transaction!]!
}

type SplitTransactionResult {
  """
  The original transaction that was split (updated with reduced amount).
  """
  sourceTransaction: Transaction!

  """
  The newly created split transactions.
  """
  splitTransactions: [Transaction!]!
}

"""
A sibling transaction within the same split group.
"""
type SiblingTransaction {
  id: Int!
  """
  Amount in major units (always positive).
  """
  amount: Float!
  currency: String!
  description: String!
  category: Category
  budget: Budget
}
