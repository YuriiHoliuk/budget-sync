# Docker Compose for E2E testing
#
# This configuration creates an isolated test environment with:
# - Fresh PostgreSQL database
# - API server with mocked external services
# - Next.js frontend
#
# Usage:
#   docker compose -f docker-compose.e2e.yml up -d --wait  # Start and wait for healthy
#   docker compose -f docker-compose.e2e.yml down -v       # Stop and reset
#
# The environment is designed for Playwright E2E tests that run against
# the full stack with real database but mocked Monobank/Spreadsheet APIs.

name: budget-sync-e2e

services:
  db-e2e:
    image: postgres:16-alpine
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: budget_sync_test
      POSTGRES_PASSWORD: budget_sync_test
      POSTGRES_DB: budget_sync_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U budget_sync_test"]
      interval: 2s
      timeout: 2s
      retries: 10
    tmpfs:
      - /var/lib/postgresql/data

  db-migrate-e2e:
    build:
      context: .
      target: builder
    working_dir: /app
    env_file: []
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      DATABASE_URL: postgresql://budget_sync_test:budget_sync_test@db-e2e:5432/budget_sync_test
    depends_on:
      db-e2e:
        condition: service_healthy
    command: ["bunx", "drizzle-kit", "migrate"]

  db-seed-e2e:
    build:
      context: .
      target: builder
    working_dir: /app
    env_file: []
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      DATABASE_URL: postgresql://budget_sync_test:budget_sync_test@db-e2e:5432/budget_sync_test
    depends_on:
      db-migrate-e2e:
        condition: service_completed_successfully
    command: ["bun", "scripts/seed-local-db.ts"]

  api-e2e:
    build:
      context: .
      target: builder
    working_dir: /app
    env_file: []
    ports:
      - "4002:4002"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      DATABASE_URL: postgresql://budget_sync_test:budget_sync_test@db-e2e:5432/budget_sync_test
      PORT: "4002"
      NODE_ENV: test
      # These are required but will use mock implementations
      MONOBANK_TOKEN: mock-token
      SPREADSHEET_ID: mock-spreadsheet-id
      GEMINI_API_KEY: mock-gemini-key
    depends_on:
      db-seed-e2e:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "bun", "--eval", "const r = await fetch('http://localhost:4002/health'); process.exit(r.ok ? 0 : 1)"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
    command: ["bun", "run", "src/server.ts"]

  web-e2e:
    build:
      context: .
      dockerfile: Dockerfile.web
      target: deps
    working_dir: /app/web
    env_file: []
    ports:
      - "3001:3000"
    volumes:
      - .:/app
      - /app/web/node_modules
      - /app/web/.next
    environment:
      API_URL: http://api-e2e:4002
      NEXT_PUBLIC_ALLOWED_EMAIL: test@example.com
      NEXT_PUBLIC_ALLOWED_PASSWORD: testpassword123
      NODE_ENV: test
    depends_on:
      api-e2e:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bun", "--eval", "const r = await fetch('http://localhost:3000'); process.exit(r.ok ? 0 : 1)"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 90s
    command: ["sh", "-c", "bun run codegen && bun run build && bun run start"]
